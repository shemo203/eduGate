<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eduGate File Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
  </head>

  
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="/">eduGate</a>
        <div>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 d-flex flex-row gap-3">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/submissions">Submissions</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">All Submissions</h2>
        {% if submissions %}
          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Submission ID</th>
                  <th>Course Name</th>
                </tr>
              </thead>
              <tbody>
                {% for sub in submissions %}
                  <tr>
                    <td>{{ sub.id}}</td>
                    <td>{{ sub.course_name }}</td>
                    <td><a href ="submissions/{{ sub.id }}" class="btn btn-primary">Open</button></td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        {% else %}
          <p>No submissions found.</p>
        {% endif %}
      </div>
    </body>
    </html>
