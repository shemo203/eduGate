<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Submission Result - eduGate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body class="bg-light text-black">
    {% include 'navbar.html' %}

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card border-primary mb-3 shadow">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">AI Content Detected</h4>
            </div>
            <div class="card-body">
              <div class="alert alert-info border-primary" role="alert" style="background-color: #e0eafc; color: #003366;">
                <strong>Notice:</strong> Our system detected AI-generated content in your submission.
              </div>
              <p class="mb-3">
                <strong>AI Score:</strong> {{ message }}
              </p>
              <a href="{{ url_for('submissions_page') }}" class="btn btn-outline-primary">Back to Submissions</a>
              <a href="{{ url_for('view_submission', submission_id=submission_id) }}" class="btn btn-primary ms-2">Submit Another File</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
