<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eduGate File Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
  </head>

  
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="/">eduGate</a>
        <div>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 d-flex flex-row gap-3">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/submissions">Submissions</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

  <div class="container d-flex justify-content-center mt-5">
    <div class="w-50">
      <form method="POST" enctype="multipart/form-data">
        <div class="border border-dark p-3 rounded">
          <div class="mb-3">
            <label for="formFile" class="form-label">Ladda upp fil</label>
            <input class="form-control" type="file" id="formFile" name="file" required>
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <div class="container d-flex justify-content-center mt-5">
    <div class="w-50">
      <div class="border border-dark p-4 rounded">
        <h6 class="mb-3">Instructions</h6>
        <h7 class="mb-0">Accepted formats: PDF <br> This tool analyzes documents for AI-generated content </h7>
      </div>
    </div>
  </div>
 



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
